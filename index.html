*{box-sizing:border-box;font-family:Tahoma,sans-serif}

.hdr{background:linear-gradient(135deg,#8e44ad,#9b59b6);color:#fff;padding:22px;text-align:center}

.title{background:#9b59b6;color:#fff;padding:12px;border-radius:10px;font-weight:bold;margin-bottom:12px;font-size:15px;text-align:right}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{background:#fff;border-radius:10px;overflow:hidden;border:1px solid #eee;display:flex;flex-direction:column}
.card img{width:100%;height:120px;object-fit:cover;display:block}
.card .body{padding:8px;flex:1;display:flex;flex-direction:column}
.card .pname{font-size:13px;font-weight:bold;color:#222;height:38px;overflow:hidden;line-height:1.4}
.card .pprice{font-size:13px;color:#8e44ad;font-weight:bold;margin:4px 0}
.card a{color:#1976d2;font-size:11px;text-decoration:none;margin-top:auto}

function setStatus(msg, color){
  var s = document.getElementById("status");
  s.innerText = msg;
  s.style.background = color;
  s.style.display = "block";
  setTimeout(function(){ s.style.display = "none"; }, 5000);
}

function tryFetch(url){
  return fetch(url, {cache: "no-store"}).then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  });
}

async function loadFresh(){
  var proxies = [
    function(u){ return "https://api.allorigins.win/raw?url=" + encodeURIComponent(u); },
    function(u){ return "https://corsproxy.io/?" + encodeURIComponent(u); },
    function(u){ return u; }
  ];

  for(var pi = 0; pi < proxies.length; pi++){
    try{
      var all = [], pg = 1;
      while(pg <= 10){
        var url = proxies[pi](REAL + pg);
        var d = await tryFetch(url);
        if(!d || !d.length) break;
        all = all.concat(d);
        pg++;
      }
      if(all.length > 0){
        DB = all.filter(function(p){ return p.prices && p.prices.price && parseInt(p.prices.price) > 0; }).map(function(p){
          return {
            name: p.name,
            price: parseInt(p.prices.price),
            link: p.permalink,
            img: (p.images && p.images[0]) ? p.images[0].src : "",
            sale: p.on_sale,
            cat: p.categories ? p.categories.map(function(c){ return c.name; }) : []
          };
        });
        localStorage.setItem("banriDB", JSON.stringify(DB));
        localStorage.setItem("banriTime", Date.now());
        setStatus("✅ " + DB.length + " محصول (آپدیت زنده)", "#27ae60");
        return;
      }
    } catch(e){
    }
  }
  var saved = localStorage.getItem("banriDB");
  if(saved){
    DB = JSON.parse(saved);
    var t = localStorage.getItem("banriTime");
    var mins = Math.floor((Date.now() - t) / 60000);
    setStatus("📦 " + DB.length + " (کش، " + mins + " دقیقه پیش)", "#8e44ad");
  } else {
    setStatus("📦 " + DB.length + " (دیتای داخلی)", "#8e44ad");
  }
}

function F(t){
  var i = [], ti = "";
  if(t === 0){ i = DB.filter(function(p){ return p.sale; }); ti = "🔥 تخفیف‌دار"; }
  else if(t === 1){ i = DB.filter(function(p){ return p.price > 0; }).sort(function(a,b){ return a.price - b.price; }); ti = "💸 ارزان‌ترین"; }
  else if(t === 2){ i = DB.filter(function(p){ return p.price > 0; }).sort(function(a,b){ return b.price - a.price; }); ti = "💎 گران‌ترین"; }
  else if(t === 3){ i = DB.filter(function(p){ return p.name.indexOf("برقی") !== -1; }); ti = "⚡ برقی"; }
  else if(t === 4){ i = DB.filter(function(p){ return p.name.indexOf("شارژ") !== -1; }); ti = "🔋 شارژی"; }

  R(i, ti);
}

function R(items, ti){
  document.getElementById("T").innerText = ti + " (" + items.length + " محصول)";
  var g = document.getElementById("G");
  g.innerHTML = "";
  items.forEach(function(p){
    var c = document.createElement("div");
    c.className = "card";
    var im = "";
    if(p.img){
      im = "<img src='" + p.img + "' referrerpolicy='no-referrer' loading='lazy'>";
    }
    var price = p.price ? p.price.toLocaleString("fa-IR") + " تومان" : "ناموجود";
    var badge = p.sale ? " 🔥" : "";
    var bd = "<div class='body'><div class='pname'>" + p.name + "</div><div class='pprice'>💰 " + price + badge + "</div><a href='" + p.link + "' target='_blank'>🔗 مشاهده در سایت</a></div>";

  });

  document.getElementById("S").style.display = "none";
  document.getElementById("P").style.display = "block";
}
